# Материал для тестового стенда.
#
# Требования к материалу (см. SPEC.md, раздел 5):
#   - СУЩЕСТВУЕТ В TMDB, иначе Radarr не сопоставит
#   - открытая лицензия
#   - настоящий видеофайл: есть длительность, кодек, разрешение, поэтому
#     MediaInfo и определение качества у *arr работают честно.
#     Файл-пустышка может быть отброшен как sample.
#
# tmdb_id НЕ прописан намеренно: make-fixture.sh разрешает его через
# TMDB API по названию и году. Хардкодить идентификатор, взятый по памяти,
# — прямой путь к тому, что тест проверяет не тот фильм.
#
# url нужно заполнить и ПРОВЕРИТЬ перед первым запуском: ссылки на зеркала
# открытых лент меняются. Прямая ссылка на файл, не на страницу.

movies:
  - title: Big Buck Bunny
    year: 2008
    licence: CC-BY
    url: ""            # ЗАПОЛНИТЬ: прямая ссылка на 1080p mp4/mkv
    release_name: Big.Buck.Bunny.2008.1080p.WEB-DL.x264-TEST
    category: radarr

  - title: Sintel
    year: 2010
    licence: CC-BY
    url: ""
    release_name: Sintel.2010.1080p.WEB-DL.x264-TEST
    category: radarr

  - title: Tears of Steel
    year: 2012
    licence: CC-BY
    url: ""
    release_name: Tears.of.Steel.2012.1080p.WEB-DL.x264-TEST
    category: radarr

# Сериалов с открытой лицензией и записью в TVDB практически нет.
# Практичный обход: взять tvdb_id реального сериала, а файлом положить ту же
# короткометражку, переименованную в SxxEyy. Sonarr сопоставляет по имени,
# не по содержимому, поэтому импорт проверяется честно.
#
# Держать ТОЛЬКО в выбрасываемом тестовом root folder (TEST_SONARR_ROOT),
# чтобы потом не разбирать это в настоящей библиотеке.
series:
  - tmdb_id: null      # ЗАПОЛНИТЬ: любой реальный сериал, у которого
                       # в TMDB external_ids ЕСТЬ tvdb_id
    season: 1
    episode: 1
    source_file: Big Buck Bunny
    release_name: ""   # ЗАПОЛНИТЬ по релизной конвенции с SxxEyy
    category: sonarr

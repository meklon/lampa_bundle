# Единственный compose-файл. Различия между ВМ и сервером живут в .env,
# а не в отдельном dev-варианте: стенд должен повторять форму продакшена,
# иначе баг с жёсткими ссылками не воспроизводится.
#
# КРИТИЧНО: у всех сервисов ОДНО монтирование ${DATA_ROOT}:/data.
# Не разделять на /downloads и /movies — сломаются жёсткие ссылки.

# ВЕРСИИ ОБРАЗОВ зафиксированы прямо здесь, значениями по умолчанию.
#
# Причина: набор проверен именно на этих версиях, и человек, поднимающий его
# впервые, не должен подбирать теги сам. Переопределить можно переменной в
# .env — синтаксис ${VAR:-умолчание} берёт её, если задана.
#
# Обновление версий — правка этого файла, а не .env: она проходит проверку
# схем (scripts/check-versions.sh) и попадает в историю. Миграции БД у *arr
# односторонние, поэтому версия — часть кода, а не локальная настройка.
#
# Проверено на: Radarr 6.3.0.10514, Sonarr 4.0.19.2979, Prowlarr 2.5.2.5491,
# qBittorrent 5.2.3 (libtorrent v2.0.13), Lampac 1.4.3 — 2026-08-01.

# Ротация логов. Драйвер json-file по умолчанию растёт без предела и однажды
# съедает диск — на домашнем сервере это обнаруживается по полному разделу.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Подготовка перед стартом. Делает то, что нельзя выразить переменными
  # окружения: каталоги, пароль qBittorrent и — главное — ПРОВЕРКУ, что
  # жёсткая ссылка между торрентами и библиотекой реально создаётся.
  #
  # Проверка стоит здесь, а не в отдельном скрипте, ровно потому, что должна
  # валить развёртывание. Когда ссылка невозможна, *arr молча копируют:
  # ошибки нет, место уходит вдвое, узнаёшь через месяц.
  #
  # Ключи API сюда не попали: *arr берут их из переменных окружения.
  init:
    image: ${STACK_IMAGE:-ghcr.io/meklon/media-stack}:${STACK_VERSION:-latest}
    container_name: init
    volumes:
      - ${DATA_ROOT}:/data
      - ${CONFIG_ROOT:-./config}/qbittorrent:/qbt-config
      - ${CONFIG_ROOT:-./config}/lampac:/lampac-config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TORRENTS_PATH=${TORRENTS_PATH}
      - MOVIES_PATH=${MOVIES_PATH}
      - TV_PATH=${TV_PATH}
      - QBITTORRENT_USER=${QBITTORRENT_USER}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
    command: ["python3", "/app/scripts/init.py"]
    restart: "no"
    logging: *logging

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_TAG:-5.2.3_v2.0.13-ls469}
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      - WEBUI_PORT=8081
      - TORRENTING_PORT=6881
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${CONFIG_ROOT:-./config}/qbittorrent:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    healthcheck:
      # Веб-интерфейс отвечает 200 без авторизации. Проверяем ЕГО, а не
      # наличие процесса: у Lampac штатный healthcheck делает pgrep dotnet и
      # рапортует healthy при неотвечающем порте — мы это уже ловили.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *logging
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_TAG:-2.5.2.5491-ls155}
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      # Ключ API задаётся переменной, а не выковыривается из config.xml после
      # первого старта. Проверено: принимается и сохраняется.
      - PROWLARR__AUTH__APIKEY=${PROWLARR_API_KEY}
    volumes:
      - ${CONFIG_ROOT:-./config}/prowlarr:/config
    ports:
      - "9696:9696"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9696/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *logging
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_TAG:-6.3.0.10514-ls312}
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      # Ключ API задаётся переменной, а не выковыривается из config.xml после
      # первого старта. Проверено: принимается и сохраняется.
      - RADARR__AUTH__APIKEY=${RADARR_API_KEY}
    volumes:
      - ${CONFIG_ROOT:-./config}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "7878:7878"
    depends_on:
      - qbittorrent
    healthcheck:
      # /ping отвечает 200 без ключа API — проверено.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7878/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *logging
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_TAG:-4.0.19.2979-ls320}
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      # Ключ API задаётся переменной, а не выковыривается из config.xml после
      # первого старта. Проверено: принимается и сохраняется.
      - SONARR__AUTH__APIKEY=${SONARR_API_KEY}
    volumes:
      - ${CONFIG_ROOT:-./config}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8989:8989"
    depends_on:
      - qbittorrent
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8989/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *logging
    restart: unless-stopped

  bridge:
    # Только опубликованный образ. Сборка из исходников вынесена в
    # docker-compose.dev.yml: этот файл раздаётся отдельно от репозитория, и
    # ссылка на ./bridge на сервере указывала бы в никуда.
    image: ${BRIDGE_IMAGE:-ghcr.io/meklon/media-stack-bridge}:${STACK_VERSION:-latest}
    container_name: bridge
    environment:
      - BRIDGE_ENV=${BRIDGE_ENV}
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_ROOT=/data/${MOVIES_PATH}
      - RADARR_PROFILE=${RADARR_PROFILE}
      - RADARR_MIN_AVAILABILITY=${RADARR_MIN_AVAILABILITY}
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=${SONARR_API_KEY}
      - SONARR_ROOT=/data/${TV_PATH}
      - SONARR_PROFILE=${SONARR_PROFILE}
      - TMDB_TOKEN=${TMDB_TOKEN}
      # Страница Lampa приходит с Lampac (:9118), bridge живёт на :8000 —
      # для браузера это разные origin, без CORS заказ не уйдёт.
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Заказы в dev-режиме метятся тегом, чтобы их можно было снести
      # по нему одной командой.
      - TEST_TAG=${TEST_TAG}
    ports:
      - "8000:8000"
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    healthcheck:
      # В python:3.12-slim нет ни curl, ни wget — проверяем средствами самого
      # интерпретатора.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    restart: unless-stopped

  # Раскомментировать, только если конкретный трекер требует обхода Cloudflare.
  # Сам по себе хрупкий, добавляет точку отказа. На этапах 1-5 не нужен.
  # flaresolverr:
  #   image: ghcr.io/flaresolverr/flaresolverr:${FLARESOLVERR_TAG}
  #   container_name: flaresolverr
  #   environment:
  #     - LOG_LEVEL=info
  #     - TZ=${TZ}
  #   ports:
  #     - "8191:8191"
  #   restart: unless-stopped

  # Lampac — бэкенд Lampa: TMDB-прокси и раздача фронтенда. Именно к нему
  # подключается приложение на телефоне, поэтому он часть набора, а не
  # опциональный довесок.
  #
  # Образ НЕ на Docker Hub: репозитория immisterio/lampac там не существует.
  # Проект указывает на ghcr.io/lampac-nextgen/lampac.
  #
  # init.conf монтируется ОБЯЗАТЕЛЬНО. Без него берётся base.conf, где у
  # listen не задан ip: сервис вяжется на 127.0.0.1 ВНУТРИ контейнера, проброс
  # порта ведёт в никуда, и снаружи Lampac недоступен. Healthcheck образа при
  # этом показывает healthy — он проверяет только наличие процесса.
  #
  # Файл лежит в git (lampac/init.conf), а не в config/: это декларативная
  # настройка, а не состояние сервиса.
  lampac:
    image: ghcr.io/lampac-nextgen/lampac:${LAMPAC_TAG:-1.4.3}
    depends_on:
      init:
        condition: service_completed_successfully
    container_name: lampac
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT:-./config}/lampac/init.conf:/lampac/init.conf
    ports:
      - "9118:9118"
    # Задано вслед за официальным compose проекта: парсерам нужна разделяемая
    # память, с умолчанием в 64 МБ они падают.
    shm_size: 1024mb
    healthcheck:
      # Переопределяет healthcheck образа (pgrep -x dotnet). Тот показывал
      # healthy, когда сервис вязался на 127.0.0.1 и снаружи не отвечал.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9118/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *logging
    restart: unless-stopped

  # Провижининг как часть стека, а не отдельный шаг руками.
  #
  # Запускается при каждом `compose up`, дожидаясь готовности всех, кого
  # настраивает. Это безопасно и полезно: скрипты идемпотентны (проверено),
  # поэтому повторный запуск не создаёт дубликатов, зато исправляет ручные
  # правки, которые кто-то сделал через веб-морду. Конфигурация возвращается
  # к описанной в репозитории.
  #
  # restart: no — сервис одноразовый: отработал и вышел. Ненулевой код виден
  # в `compose ps` и в логах, то есть сломанная настройка не проходит молча.
  provision:
    image: ${STACK_IMAGE:-ghcr.io/meklon/media-stack}:${STACK_VERSION:-latest}
    container_name: provision
    depends_on:
      qbittorrent:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    environment:
      # Внутри compose-сети адреса другие: localhost указывал бы на сам
      # контейнер провижининга.
      - RADARR_BASE=http://radarr:7878
      - SONARR_BASE=http://sonarr:8989
      - PROWLARR_BASE=http://prowlarr:9696
      - QBT_BASE=http://qbittorrent:8081
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - QBITTORRENT_USER=${QBITTORRENT_USER:-admin}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - TORRENTS_PATH=${TORRENTS_PATH}
      - MOVIES_PATH=${MOVIES_PATH}
      - TV_PATH=${TV_PATH}
      # Схема имён. Пусто — берутся проверенные умолчания из образа.
      - RADARR_MOVIE_FORMAT=${RADARR_MOVIE_FORMAT:-}
      - RADARR_FOLDER_FORMAT=${RADARR_FOLDER_FORMAT:-}
      - SONARR_EPISODE_FORMAT=${SONARR_EPISODE_FORMAT:-}
      - SONARR_DAILY_FORMAT=${SONARR_DAILY_FORMAT:-}
      - SONARR_ANIME_FORMAT=${SONARR_ANIME_FORMAT:-}
      - SONARR_SERIES_FOLDER_FORMAT=${SONARR_SERIES_FOLDER_FORMAT:-}
      - SONARR_SEASON_FOLDER_FORMAT=${SONARR_SEASON_FOLDER_FORMAT:-}
    restart: "no"
    logging: *logging

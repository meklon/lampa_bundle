[project]
name = "bridge"
version = "0.1.0"
description = "Мост Lampa -> Radarr/Sonarr"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    # Версия ЗАКРЕПЛЕНА, а не ">=". С плавающей границей CI ставит свежайший
    # ruff, у которого шире набор правил по умолчанию, и сборка падает без
    # единой правки кода. Ровно это и случилось: pre-commit держал v0.6.9,
    # а CI ставил 0.16.1 — один инструмент, два вердикта.
    #
    # Обновление версии — осознанная правка здесь И в .pre-commit-config.yaml.
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Пакет указывается явно. Автоопределение падает с «Multiple top-level
# packages discovered in a flat-layout: ['app', 'static']» — рядом с кодом
# лежит static/ с plugin.js, и setuptools не берётся угадывать.
#
# Ошибка была не видна: Dockerfile выполнял
#   pip install -e . 2>/dev/null || pip install fastapi ... httpx ...
# то есть глушил вывод и молча ставил второй, захардкоженный список версий.
# Сборка при этом проходила, а pyproject.toml не участвовал вовсе.
[tool.setuptools]
packages = ["app"]

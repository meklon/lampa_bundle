{
  "_comment": [
    "Конфигурация Lampac. Лежит в git, а не в config/, потому что это",
    "декларативная настройка, а не состояние сервиса: в config/ живут базы",
    "SQLite у *arr, и он намеренно под .gitignore.",
    "",
    "Файл монтируется в /lampac/init.conf. Без него контейнер берёт base.conf,",
    "где у listen НЕ ЗАДАН ip — сервис вяжется на 127.0.0.1 внутри контейнера,",
    "проброс порта ведёт в никуда, и снаружи он недоступен. При этом",
    "healthcheck образа проверяет только наличие процесса (pgrep dotnet),",
    "поэтому контейнер бодро показывает healthy. Проверено 2026-08-01.",
    "",
    "Полный список параметров — example.init.conf внутри образа."
  ],

  "listen": {
    "ip": "0.0.0.0",
    "port": 9118,
    "scheme": "http"
  },

  "openstat": {
    "_comment": "Отправка статистики наружу. Выключена: решение о телеметрии за человеком.",
    "enable": false
  }
}
